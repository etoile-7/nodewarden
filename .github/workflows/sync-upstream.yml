name: Sync upstream

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: main

      - name: Merge and push upstream changes
        env:
          TARGET_BRANCH: main
          UPSTREAM_BRANCH: main
          UPSTREAM_URL: https://github.com/shuaiplus/nodewarden.git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_URL"
          git fetch --prune upstream "$UPSTREAM_BRANCH"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date."
            exit 0
          fi

          git merge --no-edit "upstream/$UPSTREAM_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
